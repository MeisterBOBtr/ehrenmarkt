<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ehrenmarkt – Anmeldung</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 12px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #f2e6cf;


            background-image:

                linear-gradient(
                    rgba(8, 6, 5, 0.38),
                    rgba(8, 6, 5, 0.78)
                ),

                url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Login.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =========================
           LOGIN BOX
        ========================= */

        .login-box {

            width: 100%;

            max-width: 450px;

            padding: 30px 25px;

            background:
                rgba(18, 14, 11, 0.95);

            border:
                2px solid #b88a3b;

            border-radius: 15px;

            box-shadow:

                0 15px 50px
                rgba(0, 0, 0, 0.75),

                inset 0 0 30px
                rgba(184, 138, 59, 0.08);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            margin-bottom: 8px;
        }


        .logo h1 {

            color: #d6ad52;

            font-size: 38px;

            letter-spacing: 2px;

            text-shadow:
                0 2px 6px #000;
        }


        .logo p {

            margin-top: 7px;

            color: #c8b99e;

            font-size: 15px;

            line-height: 1.5;
        }


        .linie {

            width: 100%;

            height: 1px;

            margin: 23px 0;

            background:
                #8f6b32;
        }


        /* =========================
           FORMULAR
        ========================= */

        .feld {

            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #d6ad52;

            font-size: 15px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 14px;

            background:
                #0f0c09;

            color: #ffffff;

            border:
                1px solid #6f552d;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 16px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:focus {

            border-color:
                #d6ad52;

            box-shadow:

                0 0 10px
                rgba(214, 173, 82, 0.25);
        }


        input::placeholder {

            color:
                #8f8475;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            padding: 14px;

            margin-top: 4px;

            background:

                linear-gradient(
                    #c79b48,
                    #8f6b32
                );

            color: #ffffff;

            border:
                1px solid #e1bd6b;

            border-radius: 8px;

            font-family: inherit;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:

                0 4px 10px
                rgba(0, 0, 0, 0.4);

            transition:
                filter 0.2s,
                transform 0.1s;
        }


        .login-button:hover {

            filter:
                brightness(1.12);
        }


        .login-button:active {

            transform:
                scale(0.99);
        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: wait;

            filter: none;
        }


        /* =========================
           MELDUNG
        ========================= */

        #meldung {

            min-height: 24px;

            margin-top: 15px;

            text-align: center;

            color:
                #d9a477;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================
           LINKS
        ========================= */

        .links {

            margin-top: 20px;

            text-align: center;
        }


        .links p {

            margin: 12px 0;

            color:
                #bcae98;

            font-size: 13px;
        }


        .links a {

            color:
                #d6ad52;

            text-decoration: none;

            font-size: 13px;
        }


        .links a:hover {

            text-decoration: underline;
        }


        .zurueck {

            color:
                #bcae98 !important;
        }


        /* =========================
           FEHLER
        ========================= */

        .fehler {

            display: none;

            margin-bottom: 16px;

            padding: 11px;

            background:
                rgba(92, 27, 20, 0.75);

            border:
                1px solid #98493c;

            border-radius: 7px;

            color:
                #efb1a5;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================
           HANDY
        ========================= */

        @media (max-width: 600px) {

            body {

                padding:
                    15px 10px;

                background-attachment:
                    scroll;
            }


            .login-box {

                max-width:
                    100%;

                padding:
                    25px 19px;

                border-radius:
                    13px;
            }


            .logo h1 {

                font-size:
                    31px;
            }


            .logo p {

                font-size:
                    13px;
            }


            input {

                padding:
                    13px;

                font-size:
                    16px;
            }


            .login-button {

                padding:
                    13px;

                font-size:
                    16px;
            }
        }


        /* =========================
           KLEINE HANDYS
        ========================= */

        @media (max-width: 380px) {

            .login-box {

                padding:
                    22px 15px;
            }


            .logo h1 {

                font-size:
                    28px;
            }


            .linie {

                margin:
                    19px 0;
            }
        }

    </style>

</head>


<body>


    <main class="login-box">


        <!-- LOGO -->

        <div class="logo">

            <h1>
                Ehrenmarkt
            </h1>

            <p>
                Anmeldung & Kundenkonto
            </p>

        </div>


        <div class="linie"></div>


        <!-- FEHLERMELDUNG -->

        <div
            id="fehler"
            class="fehler"
        ></div>


        <!-- LOGIN / PROFIL FORMULAR -->

        <form id="loginForm">


            <!-- BENUTZERNAME -->

            <div class="feld">

                <label for="username">
                    Benutzername
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Dein Benutzername"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- MINECRAFT NAME -->

            <div class="feld">

                <label for="minecraftName">
                    Minecraft-Name
                </label>

                <input
                    type="text"
                    id="minecraftName"
                    name="minecraft_name"
                    placeholder="Dein Minecraft-Name"
                    autocomplete="off"
                    required
                >

            </div>


            <!-- E-MAIL -->

            <div class="feld">

                <label for="email">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Deine E-Mail-Adresse"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORT -->

            <div class="feld">

                <label for="passwort">
                    Passwort
                </label>

                <input
                    type="password"
                    id="passwort"
                    name="password"
                    placeholder="Dein Passwort"
                    autocomplete="current-password"
                    required
                >

            </div>

                        <!-- ANMELDEN -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                ⚜ Anmelden ⚜
            </button>

        </form>


        <!-- STATUSMELDUNG -->

        <div id="meldung"></div>


        <!-- =========================
             WEITERE LINKS
        ========================= -->

        <div class="links">

            <p>

                <a href="#">
                    Passwort vergessen?
                </a>

            </p>


            <p>

                Noch kein Konto?

                <a href="registrieren.html">
                    Registrieren
                </a>

            </p>


            <p>

                <a
                    href="startseite.html"
                    class="zurueck"
                >
                    ← Zurück zum Ehrenmarkt
                </a>

            </p>

        </div>


    </main>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>


    <!-- =========================
         LOGIN JAVASCRIPT
         KOMMT SPÄTER ALS
         SEPARATE DATEI
    ========================= -->

    <script src="../JS/login.js?v=2"></script>


</body>

</html>

<!--
    Hinweis:

    Die Anmeldung und das Speichern der Profildaten
    erfolgt über:

    ../JS/login.js

    Dort wird später:
    - die bestehende Session geprüft
    - E-Mail + Passwort angemeldet
    - der Benutzer in profiles gesucht
    - username gespeichert
    - minecraft_name gespeichert
    - user_type auf "kunde" gesetzt
    - rang nicht vom Benutzer verändert
    - rolle nicht vom Benutzer verändert
    - anschließend zu startseite.html weitergeleitet
-->
