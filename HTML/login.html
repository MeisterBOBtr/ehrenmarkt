<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ehrenmarkt – Anmeldung</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 12px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #f2e6cf;

            background-image:

                linear-gradient(
                    rgba(8, 6, 5, 0.38),
                    rgba(8, 6, 5, 0.78)
                ),

                url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Login.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =========================
           LOGIN BOX
        ========================= */

        .login-box {

            width: 100%;
            max-width: 440px;

            padding: 30px 25px;

            background:
                rgba(18, 14, 11, 0.95);

            border:
                2px solid #b88a3b;

            border-radius: 15px;

            box-shadow:

                0 15px 50px
                rgba(0, 0, 0, 0.75),

                inset 0 0 30px
                rgba(184, 138, 59, 0.08);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;
        }


        .logo h1 {

            color: #d6ad52;

            font-size: 38px;

            letter-spacing: 2px;

            text-shadow:
                0 2px 6px #000;
        }


        .logo p {

            margin-top: 7px;

            color: #c8b99e;

            font-size: 15px;
        }


        .linie {

            height: 1px;

            margin: 23px 0;

            background:
                #8f6b32;
        }


        /* =========================
           FORMULAR
        ========================= */

        .feld {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #d6ad52;

            font-size: 15px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 14px;

            background:
                #0f0c09;

            color: white;

            border:
                1px solid #6f552d;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 16px;
        }


        input:focus {

            border-color:
                #d6ad52;

            box-shadow:
                0 0 10px
                rgba(214, 173, 82, 0.25);
        }


        input::placeholder {

            color: #8f8475;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            padding: 14px;

            margin-top: 4px;

            background:
                linear-gradient(
                    #c79b48,
                    #8f6b32
                );

            color: white;

            border:
                1px solid #e1bd6b;

            border-radius: 8px;

            font-family: inherit;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 10px
                rgba(0, 0, 0, 0.4);

            transition: 0.2s;
        }


        .login-button:hover {

            filter:
                brightness(1.12);
        }


        .login-button:active {

            transform:
                scale(0.99);
        }


        .login-button:disabled {

            opacity: 0.65;

            cursor: wait;
        }


        /* =========================
           MELDUNG
        ========================= */

        #meldung {

            min-height: 24px;

            margin-top: 15px;

            text-align: center;

            color: #d9a477;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================
           LINKS
        ========================= */

        .links {

            margin-top: 20px;

            text-align: center;
        }


        .links p {

            margin: 12px 0;
        }


        .links a {

            color: #d6ad52;

            text-decoration: none;

            font-size: 13px;
        }


        .links a:hover {

            text-decoration: underline;
        }


        .zurueck {

            color:
                #bcae98 !important;
        }


        /* =========================
           HANDY
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 15px 10px;

                background-attachment:
                    scroll;
            }


            .login-box {

                padding:
                    25px 19px;

                border-radius:
                    13px;
            }


            .logo h1 {

                font-size: 31px;
            }


            .logo p {

                font-size: 13px;
            }


            input {

                padding: 13px;

                font-size: 16px;
            }


            .login-button {

                padding: 13px;

                font-size: 16px;
            }
        }


        /* =========================
           KLEINE HANDYS
        ========================= */

        @media (max-width: 380px) {

            .login-box {

                padding:
                    22px 15px;
            }


            .logo h1 {

                font-size: 28px;
            }


            .linie {

                margin:
                    19px 0;
            }
        }

    </style>

</head>


<body>


    <main class="login-box">


        <!-- =========================
             LOGO
        ========================= -->

        <div class="logo">

            <h1>
                Ehrenmarkt
            </h1>

            <p>
                Willkommen zurück
            </p>

        </div>


        <div class="linie"></div>


        <!-- =========================
             LOGIN
        ========================= -->

        <form id="loginForm">


            <div class="feld">

                <label for="email">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Deine E-Mail-Adresse"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="feld">

                <label for="passwort">
                    Passwort
                </label>

                <input
                    type="password"
                    id="passwort"
                    name="password"
                    placeholder="Dein Passwort"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                ⚜ Anmelden ⚜
            </button>


        </form>


        <div id="meldung"></div>


        <div class="links">

            <p>

                <a href="#">
                    Passwort vergessen?
                </a>

            </p>


            <p>

                Noch kein Konto?

                <a href="registrieren.html">
                    Registrieren
                </a>

            </p>


            <p>

                <a
                    href="startseite.html"
                    class="zurueck"
                >
                    ← Zurück zum Ehrenmarkt
                </a>

            </p>

        </div>


    </main>

        <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>

    <script src="../auth.js"></script>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const meldung =
            document.getElementById("meldung");

        const loginButton =
            document.getElementById("loginButton");


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const passwort =
                    document.getElementById(
                        "passwort"
                    ).value;


                if (!email || !passwort) {

                    meldung.textContent =
                        "Bitte E-Mail und Passwort eingeben.";

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Anmeldung läuft...";


                meldung.textContent =
                    "Anmeldung wird geprüft...";


                try {

                    /* =========================
                       ANMELDEN
                    ========================= */

                    const erfolgreich =
                        await anmelden(
                            email,
                            passwort
                        );


                    if (!erfolgreich) {

                        meldung.textContent =
                            "E-Mail oder Passwort ist falsch.";

                        return;
                    }


                    meldung.textContent =
                        "Anmeldung erfolgreich.";


                    /* =========================
                       AKTUELLEN BENUTZER HOLEN
                    ========================= */

                    const client =
                        window.supabaseClient;


                    if (!client) {

                        throw new Error(
                            "Supabase-Client nicht gefunden."
                        );
                    }


                    const {
                        data: userData,
                        error: userError
                    } =
                        await client.auth.getUser();


                    if (userError) {
                        throw userError;
                    }


                    const user =
                        userData?.user;


                    if (!user) {

                        throw new Error(
                            "Benutzer konnte nach der Anmeldung nicht gefunden werden."
                        );
                    }


                    /* =========================
                       PROFILES PRÜFEN
                    ========================= */

                    const {
                        data: profile,
                        error: profileError
                    } =
                        await client
                            .from("profiles")
                            .select(`
                                id,
                                username,
                                minecraft_name,
                                user_type,
                                rang,
                                rolle
                            `)
                            .eq(
                                "id",
                                user.id
                            )
                            .maybeSingle();


                    if (profileError) {
                        throw profileError;
                    }


                    /* =========================
                       KEIN PROFIL
                    ========================= */

                    if (!profile) {

                        meldung.textContent =
                            "Profil muss noch eingerichtet werden.";

                        /*
                         * Diese Seite erstellen wir
                         * als nächsten Schritt.
                         */

                        window.location.href =
                            "profil_erstellen.html";

                        return;
                    }


                    /* =========================
                       PROFIL VOLLSTÄNDIG?
                    ========================= */

                    const username =
                        profile.username?.trim();


                    const minecraftName =
                        profile.minecraft_name?.trim();


                    if (
                        !username ||
                        !minecraftName
                    ) {

                        meldung.textContent =
                            "Bitte vervollständige zuerst dein Profil.";

                        window.location.href =
                            "profil_erstellen.html";

                        return;
                    }


                    /* =========================
                       BEREICH ERMITTELN
                    ========================= */

                    const rang =
                        profile.rang || "Kunde";


                    const userType =
                        profile.user_type || "kunde";


                    /*
                     * Mitarbeiter, Leitung und
                     * Stadtleitung gehen in den
                     * Mitarbeiterbereich.
                     */

                    if (
                        userType === "mitarbeiter" ||
                        rang === "Mitarbeiter" ||
                        rang === "Leitung" ||
                        rang === "Stadtleitung"
                    ) {

                        window.location.href =
                            "mitarbeiter.html";

                        return;
                    }


                    /* =========================
                       KUNDENBEREICH
                    ========================= */

                    window.location.href =
                        "kundenbereich.html";

                }


                catch (error) {

                    console.error(
                        "Login-Fehler:",
                        error
                    );


                    meldung.textContent =
                        "Bei der Anmeldung ist ein Fehler aufgetreten.";

                }


                finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "⚜ Anmelden ⚜";

                }

            }
        );

    </script>

</body>

</html>
