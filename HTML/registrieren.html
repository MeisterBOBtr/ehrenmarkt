<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ehrenmarkt – Kundenkonto erstellen</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 12px;

            font-family: Georgia, "Times New Roman", serif;
            color: #f2e6cf;

            background-image:
                linear-gradient(
                    rgba(5, 7, 12, 0.35),
                    rgba(5, 7, 12, 0.72)
                ),
                url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Regrestrieren.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .register-box {
            width: 100%;
            max-width: 450px;

            padding: 30px 25px;

            background: rgba(15, 14, 16, 0.95);

            border: 2px solid #b88a3b;
            border-radius: 15px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.80),
                inset 0 0 30px rgba(184, 138, 59, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            color: #d6ad52;
            font-size: 38px;
            letter-spacing: 2px;

            text-shadow:
                0 2px 6px #000;
        }

        .logo p {
            margin-top: 7px;
            color: #c8b99e;
            font-size: 15px;
            line-height: 1.5;
        }

        .linie {
            width: 100%;
            height: 1px;
            margin: 23px 0;
            background: #8f6b32;
        }

        .hinweis {
            margin-bottom: 22px;
            padding: 12px;

            background: rgba(184, 138, 59, 0.08);
            border: 1px solid #6f552d;
            border-radius: 8px;

            color: #c8b99e;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .feld {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #d6ad52;
            font-size: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;

            background: #0f0c09;
            color: #ffffff;

            border: 1px solid #6f552d;
            border-radius: 8px;

            outline: none;

            font-family: inherit;
            font-size: 16px;
        }

        input:focus {
            border-color: #d6ad52;

            box-shadow:
                0 0 10px rgba(214, 173, 82, 0.25);
        }

        input::placeholder {
            color: #8f8475;
        }

        .register-button {
            width: 100%;

            padding: 14px;
            margin-top: 4px;

            background:
                linear-gradient(
                    #c79b48,
                    #8f6b32
                );

            color: #ffffff;

            border: 1px solid #e1bd6b;
            border-radius: 8px;

            font-family: inherit;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .register-button:active {
            transform: scale(0.99);
        }

        .register-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #meldung {
            min-height: 24px;
            margin-top: 15px;

            text-align: center;

            color: #d9a477;
            font-size: 13px;
            line-height: 1.5;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links p {
            margin: 12px 0;

            color: #bcae98;
            font-size: 13px;
        }

        .links a {
            color: #d6ad52;
            text-decoration: none;
            font-size: 13px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .zurueck {
            color: #bcae98 !important;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
                background-attachment: scroll;
            }

            .register-box {
                max-width: 100%;
                padding: 25px 19px;
                border-radius: 13px;
            }

            .logo h1 {
                font-size: 31px;
            }

            .logo p {
                font-size: 13px;
            }

            input {
                padding: 13px;
                font-size: 16px;
            }

            .register-button {
                padding: 13px;
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {

            .register-box {
                padding: 22px 15px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .linie {
                margin: 19px 0;
            }
        }
    </style>
</head>

<body>

    <main class="register-box">

        <div class="logo">
            <h1>Ehrenmarkt</h1>

            <p>
                Kundenkonto erstellen
            </p>
        </div>

        <div class="linie"></div>

        <div class="hinweis">
            Ein Kundenkonto ist freiwillig.
            <br>
            Du kannst auch ohne Kundenkonto Aufträge erstellen.
        </div>

        <form id="registerForm">

            <div class="feld">
                <label for="email">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Deine E-Mail-Adresse"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="feld">
                <label for="passwort">
                    Passwort
                </label>

                <input
                    type="password"
                    id="passwort"
                    placeholder="Dein Passwort"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="feld">
                <label for="passwortWiederholen">
                    Passwort wiederholen
                </label>

                <input
                    type="password"
                    id="passwortWiederholen"
                    placeholder="Passwort wiederholen"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="register-button"
                id="registerButton"
            >
                ⚜ Kundenkonto erstellen ⚜
            </button>

        </form>

        <div id="meldung"></div>

        <div class="links">

            <p>
                Bereits ein Kundenkonto?
                <a href="anmelden.html">
                    Anmelden
                </a>
            </p>

            <p>
                <a
                    href="kundenbereich.html"
                    class="zurueck"
                >
                    ← Zum Kundenbereich
                </a>
            </p>

            <p>
                <a
                    href="startseite.html"
                    class="zurueck"
                >
                    ← Zurück zum Ehrenmarkt
                </a>
            </p>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>


    <!-- REGISTRIERUNG -->

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const meldung =
            document.getElementById("meldung");

        const registerButton =
            document.getElementById("registerButton");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const passwort =
                    document
                        .getElementById("passwort")
                        .value;

                const passwortWiederholen =
                    document
                        .getElementById("passwortWiederholen")
                        .value;


                if (
                    passwort !==
                    passwortWiederholen
                ) {

                    meldung.textContent =
                        "Die Passwörter stimmen nicht überein.";

                    return;
                }


                registerButton.disabled = true;

                meldung.textContent =
                    "Registrierung läuft...";


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signUp({
                                email: email,
                                password: passwort
                            });


                    if (error) {
                        throw error;
                    }


                    if (data.user) {

    // Profil in der Tabelle "profiles" anlegen
    const { error: profilFehler } = await supabaseClient
        .from("profiles")
        .insert({
            id: data.user.id,
            user_type: "kunde",
            rang: "Kunde",
            rolle: null
        });

    if (profilFehler) {
        console.error(
            "Profil konnte nicht erstellt werden:",
            profilFehler
        );

        meldung.textContent =
            "Registrierung erfolgreich, aber das Kundenprofil konnte nicht erstellt werden.";
        return;
    }

    meldung.innerHTML =
        "✓ Registrierung erfolgreich!<br>" +
        "📧 Wir haben dir eine Bestätigungs-Mail geschickt.<br>" +
        "Bitte bestätige deine E-Mail-Adresse.";
}

                } catch (error) {

                    console.error(
                        "Registrierung fehlgeschlagen:",
                        error
                    );

                    meldung.textContent =
                        error.message ||
                        "Die Registrierung ist fehlgeschlagen.";

                } finally {

                    registerButton.disabled = false;

                }

            }
        );

    </script>

</body>

</html>
