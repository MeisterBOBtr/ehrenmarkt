<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ehrenmarkt – Registrierung</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;
            color: #f2e6cf;

            background-image:
                linear-gradient(
                    rgba(5, 7, 12, 0.35),
                    rgba(5, 7, 12, 0.72)
                ),
                url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Regrestrieren.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;

            background: rgba(15, 14, 16, 0.94);

            border: 2px solid #b88a3b;
            border-radius: 16px;

            padding: 32px 26px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.80),
                inset 0 0 30px rgba(184, 138, 59, 0.08);
        }

        .logo {
            text-align: center;
        }

        .logo h1 {
            margin: 0;

            font-size: 40px;
            letter-spacing: 2px;

            color: #d6ad52;

            text-shadow:
                0 2px 6px #000;
        }

        .logo p {
            margin: 8px 0 0;

            color: #c8b99e;
            font-size: 16px;
        }

        .linie {
            height: 1px;

            background: #8f6b32;

            margin: 25px 0;
        }

        .feld {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #d6ad52;

            font-weight: bold;
            font-size: 16px;
        }

        input {
            width: 100%;

            padding: 15px;

            background: #0f0c09;

            color: white;

            border: 1px solid #6f552d;
            border-radius: 9px;

            font-family: inherit;
            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #d6ad52;

            box-shadow:
                0 0 10px rgba(214, 173, 82, 0.25);
        }

        input::placeholder {
            color: #8f8475;
        }

        .register-button {
            width: 100%;

            margin-top: 5px;

            padding: 15px;

            background:
                linear-gradient(
                    #c79b48,
                    #8f6b32
                );

            color: white;

            border: 1px solid #e1bd6b;
            border-radius: 9px;

            font-family: inherit;
            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .register-button:hover {
            filter: brightness(1.12);
        }

        .register-button:active {
            transform: scale(0.99);
        }

        #meldung {
            min-height: 24px;

            margin-top: 16px;

            text-align: center;

            color: #d9a477;

            font-size: 14px;

            line-height: 1.5;
        }

                .links {
            text-align: center;
            margin-top: 22px;
        }

        .links p {
            margin: 13px 0;
        }

        .links a {
            color: #d6ad52;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .zurueck {
            color: #bcae98 !important;
        }


        /* =========================
           HANDY
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px 12px;
                background-attachment: scroll;
            }

            .register-box {
                max-width: 100%;
                padding: 26px 20px;
                border-radius: 14px;
            }

            .logo h1 {
                font-size: 32px;
            }

            .logo p {
                font-size: 14px;
            }

            input {
                padding: 14px;
                font-size: 16px;
            }

            .register-button {
                padding: 14px;
                font-size: 17px;
            }
        }


        /* =========================
           KLEINE HANDYS
           ========================= */

        @media (max-width: 380px) {

            body {
                padding: 12px 8px;
            }

            .register-box {
                padding: 22px 16px;
            }

            .logo h1 {
                font-size: 29px;
            }

            .linie {
                margin: 20px 0;
            }
        }


        /* =========================
           PC
           ========================= */

        @media (min-width: 601px) {

            body {
                padding: 40px;
            }

            .register-box {
                max-width: 450px;
            }
        }

    </style>
</head>

<body>

    <main class="register-box">

        <div class="logo">

            <h1>Ehrenmarkt</h1>

            <p>
                Erstelle dein Konto
            </p>

        </div>


        <div class="linie"></div>


        <form id="registerForm">

            <div class="feld">

                <label for="email">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Deine E-Mail-Adresse"
                    required
                >

            </div>


            <div class="feld">

                <label for="passwort">
                    Passwort
                </label>

                <input
                    type="password"
                    id="passwort"
                    placeholder="Dein Passwort"
                    required
                >

            </div>


            <div class="feld">

                <label for="passwortWiederholen">
                    Passwort wiederholen
                </label>

                <input
                    type="password"
                    id="passwortWiederholen"
                    placeholder="Passwort wiederholen"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button"
            >
                ⚜ Konto erstellen ⚜
            </button>

        </form>


        <div id="meldung"></div>


        <div class="links">

            <p>
                Bereits ein Konto?

                <a href="login.html">
                    Anmelden
                </a>
            </p>

            <p>
                <a
                    href="../index.html"
                    class="zurueck"
                >
                    ← Zurück zum Ehrenmarkt
                </a>
            </p>

        </div>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>

    <script src="../auth.js"></script>


    <!-- Registrierung -->

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const meldung =
            document.getElementById("meldung");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value.trim();

                const passwort =
                    document.getElementById("passwort").value;

                const passwortWiederholen =
                    document.getElementById(
                        "passwortWiederholen"
                    ).value;


                /* Passwörter vergleichen */

                if (passwort !== passwortWiederholen) {

                    meldung.textContent =
                        "Die Passwörter stimmen nicht überein.";

                    return;
                }


                meldung.textContent =
                    "Registrierung läuft...";


                const { data, error } =
                    await supabaseClient.auth.signUp({
                        email: email,
                        password: passwort
                    });


                /* Fehler */

                if (error) {

                    console.error(
                        "Registrierung fehlgeschlagen:",
                        error
                    );

                    meldung.textContent =
                        error.message;

                    return;
                }


                /* Erfolgreiche Registrierung */

                if (data.user) {

                    meldung.innerHTML =
                        "✓ Registrierung erfolgreich!<br>" +
                        "📧 Wir haben dir eine Bestätigungs-Mail geschickt.<br>" +
                        "Bitte überprüfe dein E-Mail-Postfach.";
                }

            }
        );

    </script>

</body>
</html>
