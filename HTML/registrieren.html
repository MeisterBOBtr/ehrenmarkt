<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ehrenmarkt – Kundenkonto</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 12px;

            font-family: Georgia, "Times New Roman", serif;
            color: #f2e6cf;

            background-image:
                linear-gradient(
                    rgba(5, 7, 12, 0.35),
                    rgba(5, 7, 12, 0.72)
                ),
                url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Regrestrieren.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .register-box {
            width: 100%;
            max-width: 450px;

            padding: 30px 25px;

            background: rgba(15, 14, 16, 0.95);

            border: 2px solid #b88a3b;
            border-radius: 15px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.80),
                inset 0 0 30px rgba(184, 138, 59, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            color: #d6ad52;
            font-size: 38px;
            letter-spacing: 2px;

            text-shadow:
                0 2px 6px #000;
        }

        .logo p {
            margin-top: 7px;
            color: #c8b99e;
            font-size: 15px;
            line-height: 1.5;
        }

        .linie {
            width: 100%;
            height: 1px;
            margin: 23px 0;
            background: #8f6b32;
        }

        .modus {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 22px;
        }

        .modus-button {
            padding: 11px 8px;
            background: #17120d;
            color: #bcae98;
            border: 1px solid #6f552d;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .modus-button.aktiv {
            background: linear-gradient(#c79b48, #8f6b32);
            color: #fff;
            border-color: #e1bd6b;
        }

        .bereich {
            display: none;
        }

        .bereich.aktiv {
            display: block;
        }

        .hinweis {
            margin-bottom: 22px;
            padding: 12px;

            background: rgba(184, 138, 59, 0.08);
            border: 1px solid #6f552d;
            border-radius: 8px;

            color: #c8b99e;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .feld {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #d6ad52;
            font-size: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;

            background: #0f0c09;
            color: #ffffff;

            border: 1px solid #6f552d;
            border-radius: 8px;

            outline: none;

            font-family: inherit;
            font-size: 16px;
        }

        input:focus {
            border-color: #d6ad52;

            box-shadow:
                0 0 10px rgba(214, 173, 82, 0.25);
        }

        input::placeholder {
            color: #8f8475;
        }

        .register-button {
            width: 100%;

            padding: 14px;
            margin-top: 4px;

            background:
                linear-gradient(
                    #c79b48,
                    #8f6b32
                );

            color: #ffffff;

            border: 1px solid #e1bd6b;
            border-radius: 8px;

            font-family: inherit;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .register-button:active {
            transform: scale(0.99);
        }

        .register-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #meldung {
            min-height: 24px;
            margin-top: 15px;

            text-align: center;

            color: #d9a477;
            font-size: 13px;
            line-height: 1.5;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links p {
            margin: 12px 0;

            color: #bcae98;
            font-size: 13px;
        }

        .links a {
            color: #d6ad52;
            text-decoration: none;
            font-size: 13px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .zurueck {
            color: #bcae98 !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
                background-attachment: scroll;
            }

            .register-box {
                max-width: 100%;
                padding: 25px 19px;
                border-radius: 13px;
            }

            .logo h1 {
                font-size: 31px;
            }

            .logo p {
                font-size: 13px;
            }

                    input {
                padding: 13px;
                font-size: 16px;
            }

            .register-button {
                padding: 13px;
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .register-box {
                padding: 22px 15px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .linie {
                margin: 19px 0;
            }
        }
    </style>
</head>

<body>

    <main class="register-box">

        <div class="logo">
            <h1>Ehrenmarkt</h1>
            <p>Kundenkonto</p>
        </div>

        <div class="linie"></div>

        <div class="modus">
            <button
                type="button"
                class="modus-button aktiv"
                id="registrierenModus"
            >
                Registrieren
            </button>

            <button
                type="button"
                class="modus-button"
                id="anmeldenModus"
            >
                Anmelden
            </button>
        </div>

        <!-- REGISTRIERUNG -->
        <section id="registrierenBereich" class="bereich aktiv">

            <div class="hinweis">
                Ein Kundenkonto ist freiwillig.
                <br>
                Du kannst auch ohne Kundenkonto Aufträge erstellen.
            </div>

            <form id="registerForm">

                <div class="feld">
                    <label for="registerEmail">
                        E-Mail-Adresse
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Deine E-Mail-Adresse"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="feld">
                    <label for="registerPasswort">
                        Passwort
                    </label>

                    <input
                        type="password"
                        id="registerPasswort"
                        placeholder="Dein Passwort"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="feld">
                    <label for="passwortWiederholen">
                        Passwort wiederholen
                    </label>

                    <input
                        type="password"
                        id="passwortWiederholen"
                        placeholder="Passwort wiederholen"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    ⚜ Kundenkonto erstellen ⚜
                </button>

            </form>
        </section>

        <!-- ANMELDUNG -->
        <section id="anmeldenBereich" class="bereich">

            <div class="hinweis">
                Melde dich mit der E-Mail-Adresse und dem Passwort
                deines Ehrenmarkt-Kontos an.
            </div>

            <form id="loginForm">

                <div class="feld">
                    <label for="loginEmail">
                        E-Mail-Adresse
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Deine E-Mail-Adresse"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="feld">
                    <label for="loginPasswort">
                        Passwort
                    </label>

                    <input
                        type="password"
                        id="loginPasswort"
                        placeholder="Dein Passwort"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="register-button"
                    id="loginButton"
                >
                    ⚜ Anmelden ⚜
                </button>

            </form>
        </section>

        <div id="meldung"></div>

        <div class="links">

            <p>
                <a href="kundenbereich.html" class="zurueck">
                    ← Zum Kundenbereich
                </a>
            </p>

            <p>
                <a href="startseite.html" class="zurueck">
                    ← Zurück zum Ehrenmarkt
                </a>
            </p>

        </div>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

        <script>

    // ========================================================
    // ELEMENTE
    // ========================================================

    const registerForm =
        document.getElementById("registerForm");

    const loginForm =
        document.getElementById("loginForm");

    const registerButton =
        document.getElementById("registerButton");

    const loginButton =
        document.getElementById("loginButton");

    const meldung =
        document.getElementById("meldung");

    const registrierenModus =
        document.getElementById("registrierenModus");

    const anmeldenModus =
        document.getElementById("anmeldenModus");

    const registrierenBereich =
        document.getElementById("registrierenBereich");

    const anmeldenBereich =
        document.getElementById("anmeldenBereich");


    // ========================================================
    // MELDUNG
    // ========================================================

    function zeigeMeldung(text) {

        if (meldung) {
            meldung.textContent = text;
        }

    }


    // ========================================================
    // MODUS WECHSELN
    // ========================================================

    function zeigeModus(modus) {

        zeigeMeldung("");

        if (modus === "anmelden") {

            registrierenBereich.classList.remove("aktiv");
            anmeldenBereich.classList.add("aktiv");

            registrierenModus.classList.remove("aktiv");
            anmeldenModus.classList.add("aktiv");

        } else {

            anmeldenBereich.classList.remove("aktiv");
            registrierenBereich.classList.add("aktiv");

            anmeldenModus.classList.remove("aktiv");
            registrierenModus.classList.add("aktiv");
        }
    }


    // ========================================================
    // MODUS-BUTTONS
    // ========================================================

    registrierenModus.addEventListener(
        "click",
        function () {
            zeigeModus("registrieren");
        }
    );


    anmeldenModus.addEventListener(
        "click",
        function () {
            zeigeModus("anmelden");
        }
    );


    // ========================================================
    // REGISTRIERUNG
    // ========================================================

    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("registerEmail")
                    .value
                    .trim();

            const passwort =
                document
                    .getElementById("registerPasswort")
                    .value;

            const passwortWiederholen =
                document
                    .getElementById("passwortWiederholen")
                    .value;


            if (passwort !== passwortWiederholen) {

                zeigeMeldung(
                    "Die Passwörter stimmen nicht überein."
                );

                return;
            }


            registerButton.disabled = true;

            zeigeMeldung(
                "Registrierung läuft..."
            );


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({
                        email: email,
                        password: passwort
                    });


                if (error) {
                    throw error;
                }


                if (!data.user) {

                    throw new Error(
                        "Das Benutzerkonto konnte nicht erstellt werden."
                    );
                }


                // =================================================
                // PROFIL ERSTELLEN
                // =================================================

                const {
                    error: profilFehler
                } =
                    await supabaseClient
                        .from("profiles")
                        .insert({
                            id: data.user.id,
                            user_type: "kunde",
                            rang: "Kunde",
                            rolle: null
                        });


                if (profilFehler) {

                    console.error(
                        "Profil konnte nicht erstellt werden:",
                        profilFehler
                    );

                    throw new Error(
                        "Das Kundenprofil konnte nicht erstellt werden."
                    );
                }


                // =================================================
                // DIREKTE SESSION
                // =================================================

                if (data.session) {

                    zeigeMeldung(
                        "Registrierung erfolgreich. " +
                        "Kundenbereich wird geöffnet..."
                    );

                    window.location.href =
                        "kundenbereich.html";

                    return;
                }


                // =================================================
                // E-MAIL-BESTÄTIGUNG
                // =================================================

                zeigeMeldung(
                    "✓ Registrierung erfolgreich! " +
                    "Bitte bestätige zuerst deine E-Mail-Adresse. " +
                    "Danach kannst du dich über „Anmelden“ einloggen."
                );


                zeigeModus("anmelden");


                const loginEmail =
                    document.getElementById("loginEmail");


                if (loginEmail) {
                    loginEmail.value = email;
                }


            } catch (error) {

                console.error(
                    "Registrierung fehlgeschlagen:",
                    error
                );

                zeigeMeldung(
                    error.message ||
                    "Die Registrierung ist fehlgeschlagen."
                );

            } finally {

                registerButton.disabled = false;
            }

        }
    );


    // ========================================================
    // ANMELDUNG
    // ========================================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();

            const passwort =
                document
                    .getElementById("loginPasswort")
                    .value;


            loginButton.disabled = true;


            zeigeMeldung(
                "Anmeldung läuft..."
            );


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: passwort
                    });


                if (error) {
                    throw error;
                }


                if (!data.session) {

                    throw new Error(
                        "Anmeldung erfolgreich, aber es wurde keine Sitzung erstellt."
                    );
                }


                // =================================================
                // ZIEL ERMITTELN
                // =================================================

                const parameter =
                    new URLSearchParams(
                        window.location.search
                    );


                const bereich =
                    parameter.get("bereich");


                // =================================================
                // MITARBEITERBEREICH
                // =================================================

                if (bereich === "mitarbeiter") {

                    zeigeMeldung(
                        "✓ Anmeldung erfolgreich. " +
                        "Mitarbeiterbereich wird geöffnet..."
                    );


                    window.location.href =
                        "mitarbeiterbereich.html";

                    return;
                }


                // =================================================
                // KUNDENBEREICH
                // =================================================

                zeigeMeldung(
                    "✓ Anmeldung erfolgreich. " +
                    "Kundenbereich wird geöffnet..."
                );


                window.location.href =
                    "kundenbereich.html";


            } catch (error) {

                console.error(
                    "Anmeldung fehlgeschlagen:",
                    error
                );


                let text =
                    error.message ||
                    "Die Anmeldung ist fehlgeschlagen.";


                if (
                    text
                        .toLowerCase()
                        .includes("email not confirmed")
                ) {

                    text =
                        "Bitte bestätige zuerst deine E-Mail-Adresse.";
                }


                zeigeMeldung(text);


            } finally {

                loginButton.disabled = false;
            }

        }
    );


    // ========================================================
    // BEREITS ANGEMELDET
    // ========================================================

    (async function pruefeSession() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Session konnte nicht geprüft werden:",
                    error
                );

                return;
            }


            if (!data.session) {
                return;
            }


            const parameter =
                new URLSearchParams(
                    window.location.search
                );


            const bereich =
                parameter.get("bereich");


            if (bereich === "mitarbeiter") {

                zeigeMeldung(
                    "Du bist bereits angemeldet. " +
                    "Mitarbeiterbereich wird geöffnet..."
                );


                window.location.href =
                    "mitarbeiterbereich.html";

            } else {

                zeigeMeldung(
                    "Du bist bereits angemeldet. " +
                    "Kundenbereich wird geöffnet..."
                );


                window.location.href =
                    "kundenbereich.html";
            }


        } catch (error) {

            console.error(
                "Sessionprüfung fehlgeschlagen:",
                error
            );

        }

    })();

        </script>
