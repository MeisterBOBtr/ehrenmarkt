<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EHRENMARKT – Anmeldung</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f1e5c5;
            background:
                linear-gradient(
                    rgba(5, 5, 5, 0.72),
                    rgba(5, 5, 5, 0.88)
                ),
                url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Bewerbung.png")
                center / cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 12, 10, 0.94);
            border: 1px solid #d7ad52;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.75);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            margin: 0;
            color: #d7ad52;
            font-size: 32px;
            letter-spacing: 3px;
        }

        .logo p {
            margin: 8px 0 28px;
            color: #b9aa88;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: 1px solid #5e4a2c;
            background: rgba(30, 24, 19, 0.9);
            color: #cdbb96;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            background: #3b2b18;
            border-color: #d7ad52;
            color: #d7ad52;
        }

        .formular {
            display: none;
        }

        .formular.active {
            display: block;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #d7ad52;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #5e4a2c;
            border-radius: 8px;
            background: rgba(8, 8, 8, 0.9);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d7ad52;
        }

        .haupt-button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 1px solid #d7ad52;
            border-radius: 8px;
            background: #3b2b18;
            color: #d7ad52;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .haupt-button:hover {
            background: #4a351d;
        }

        .haupt-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .meldung {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .meldung.erfolg {
            display: block;
            border: 1px solid #58733f;
            background: rgba(40, 65, 30, 0.45);
            color: #cce6ad;
        }

        .meldung.fehler {
            display: block;
            border: 1px solid #8b3f35;
            background: rgba(90, 25, 20, 0.45);
            color: #f0b0a8;
        }

        .hinweis {
            margin-top: 20px;
            padding: 12px;
            border-left: 3px solid #d7ad52;
            background: rgba(40, 30, 20, 0.5);
            color: #b9aa88;
            font-size: 13px;
            line-height: 1.5;
        }

        .zurueck {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #b9aa88;
            text-decoration: none;
            font-size: 14px;
        }

        .zurueck:hover {
            color: #d7ad52;
        }

        @media (max-width: 500px) {
            .container {
                padding: 26px 18px;
            }

            .logo h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>EHRENMARKT</h1>
        <p>Zentrale Anmeldung</p>
    </div>

    <div class="tabs">
        <button
            type="button"
            class="tab active"
            id="loginTab"
            onclick="zeigeFormular('login')">
            Anmelden
        </button>

        <button
            type="button"
            class="tab"
            id="registerTab"
            onclick="zeigeFormular('register')">
            Registrieren
        </button>
    </div>


    <!-- =====================================================
         ANMELDEN
         ===================================================== -->

    <div
        id="loginForm"
        class="formular active">

        <label for="loginEmail">
            E-Mail
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="deine@email.de"
            autocomplete="email"
        >

        <label for="loginPassword">
            Passwort
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Passwort"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="haupt-button"
            id="loginButton"
            onclick="handleLogin()">
            Anmelden
        </button>

    </div>


    <!-- =====================================================
         REGISTRIEREN
         ===================================================== -->

    <div
        id="registerForm"
        class="formular">

        <label for="registerEmail">
            E-Mail
        </label>

        <input
            type="email"
            id="registerEmail"
            placeholder="deine@email.de"
            autocomplete="email"
        >

        <label for="registerPassword">
            Passwort
        </label>

        <input
            type="password"
            id="registerPassword"
            placeholder="Mindestens 6 Zeichen"
            autocomplete="new-password"
        >

        <label for="registerPassword2">
            Passwort wiederholen
        </label>

        <input
            type="password"
            id="registerPassword2"
            placeholder="Passwort wiederholen"
            autocomplete="new-password"
        >

        <button
            type="button"
            class="haupt-button"
            id="registerButton"
            onclick="handleRegister()">
            Konto erstellen
        </button>

        <div class="hinweis">
            Nach der Registrierung bist du zunächst als Kunde
            im EHRENMARKT-System angelegt. Eine Bewerbung als
            Mitarbeiter kann später aus dem Kundenbereich
            eingereicht werden.
        </div>

    </div>


    <div id="meldung" class="meldung"></div>

    <a
        href="startseite.html"
        class="zurueck">
        Zur Startseite
    </a>

</div>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>

<script src="../auth.js"></script>


<script>
    // ========================================================
    // FORMULAR WECHSELN
    // ========================================================

    function zeigeFormular(formular) {

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");

        const loginTab =
            document.getElementById("loginTab");

        const registerTab =
            document.getElementById("registerTab");


        if (formular === "login") {

            loginForm.classList.add("active");
            registerForm.classList.remove("active");

            loginTab.classList.add("active");
            registerTab.classList.remove("active");

        } else {

            registerForm.classList.add("active");
            loginForm.classList.remove("active");

            registerTab.classList.add("active");
            loginTab.classList.remove("active");
        }

        entferneMeldung();
    }


    // ========================================================
    // MELDUNGEN
    // ========================================================

    function zeigeMeldung(text, typ) {

        const meldung =
            document.getElementById("meldung");

        meldung.textContent = text;

        meldung.className =
            "meldung " + typ;
    }


    function entferneMeldung() {

        const meldung =
            document.getElementById("meldung");

        meldung.textContent = "";
        meldung.className = "meldung";
    }


    // ========================================================
    // ANMELDEN
    // ========================================================

    async function handleLogin() {

        const email =
            document.getElementById("loginEmail")
                .value
                .trim();

        const passwort =
            document.getElementById("loginPassword")
                .value;


        if (!email || !passwort) {

            zeigeMeldung(
                "Bitte E-Mail und Passwort eingeben.",
                "fehler"
            );

            return;
        }


        const button =
            document.getElementById("loginButton");

        button.disabled = true;
        button.textContent = "Anmeldung läuft...";


        try {

            const erfolgreich =
                await anmelden(
                    email,
                    passwort
                );


            if (!erfolgreich) {

                zeigeMeldung(
                    "Die Anmeldung ist fehlgeschlagen. Bitte überprüfe deine E-Mail und dein Passwort.",
                    "fehler"
                );

                return;
            }


            zeigeMeldung(
                "✓ Erfolgreich angemeldet. Du wirst weitergeleitet...",
                "erfolg"
            );


            /*
             * WICHTIG:
             *
             * Es gibt nur EINE Anmeldung.
             *
             * Die Startseite entscheidet später automatisch,
             * ob der Benutzer Kunde oder Mitarbeiter ist.
             */

            setTimeout(() => {

                window.location.href =
                    "startseite.html";

            }, 500);


        } catch (error) {

            console.error(
                "Login-Fehler:",
                error
            );

            zeigeMeldung(
                "Bei der Anmeldung ist ein Fehler aufgetreten.",
                "fehler"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Anmelden";
        }
    }


    // ========================================================
    // REGISTRIEREN
    // ========================================================

    async function handleRegister() {

        const email =
            document.getElementById("registerEmail")
                .value
                .trim();

        const passwort =
            document.getElementById("registerPassword")
                .value;

        const passwort2 =
            document.getElementById("registerPassword2")
                .value;


        if (!email || !passwort || !passwort2) {

            zeigeMeldung(
                "Bitte alle Felder ausfüllen.",
                "fehler"
            );

            return;
        }


        if (passwort !== passwort2) {

            zeigeMeldung(
                "Die Passwörter stimmen nicht überein.",
                "fehler"
            );

            return;
        }


        if (passwort.length < 6) {

            zeigeMeldung(
                "Das Passwort muss mindestens 6 Zeichen lang sein.",
                "fehler"
            );

            return;
        }


        const button =
            document.getElementById("registerButton");

        button.disabled = true;
        button.textContent = "Konto wird erstellt...";


        try {

            const erfolgreich =
                await registrieren(
                    email,
                    passwort
                );


            if (!erfolgreich) {

                zeigeMeldung(
                    "Die Registrierung ist fehlgeschlagen. Bitte überprüfe deine Angaben.",
                    "fehler"
                );

                return;
            }


            zeigeMeldung(
                "✓ Registrierung erfolgreich. Bitte melde dich jetzt an.",
                "erfolg"
            );


            document.getElementById(
                "loginEmail"
            ).value = email;


            document.getElementById(
                "loginPassword"
            ).value = "";


            zeigeFormular("login");


        } catch (error) {

            console.error(
                "Registrierungs-Fehler:",
                error
            );

            zeigeMeldung(
                "Bei der Registrierung ist ein Fehler aufgetreten.",
                "fehler"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Konto erstellen";
        }
    }


    // ========================================================
    // BEREITS ANGEMELDET?
    // ========================================================

    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            try {

                const user =
                    await aktuellerBenutzer();


                if (user) {

                    zeigeMeldung(
                        "Du bist bereits angemeldet. Du wirst zur Startseite weitergeleitet...",
                        "erfolg"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "startseite.html";

                    }, 500);
                }

            } catch (error) {

                console.error(
                    "Session-Prüfung fehlgeschlagen:",
                    error
                );
            }
        }
    );

</script>

    <script src="../JS/saubere-links.js"></script>

</body>
</html>
