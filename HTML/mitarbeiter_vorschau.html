<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ehrenmarkt – Mitarbeiter</title><style>
:root{--gold:#c9a45a;--gold2:#e0bd70;--text:#eee8da;--muted:#bcb3a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Georgia,"Times New Roman",serif;background:linear-gradient(rgba(8,7,5,.34),rgba(8,7,5,.58)),url("https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/Dunkel.png") center/cover fixed no-repeat}.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:18px 0 50px}.corner-banner{width:86px;position:fixed;left:14px;top:12px;z-index:20;filter:drop-shadow(0 4px 8px #000)}.topbar{min-height:76px;padding:14px 18px 14px 112px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(12,11,9,.86);border:1px solid rgba(201,164,90,.55);box-shadow:0 10px 30px #0008}.brand h1{margin:0;font-size:clamp(25px,4vw,38px);color:var(--gold2)}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}.back{padding:10px 15px;border:1px solid rgba(201,164,90,.55);background:#17150f;border-radius:7px;color:var(--gold2);white-space:nowrap}.hero{margin-top:20px;padding:30px 22px;text-align:center;background:linear-gradient(180deg,#17140fdc,#0d0c0be8);border:1px solid rgba(201,164,90,.55);box-shadow:0 12px 35px #0008}.hero h2{margin:0 0 8px;font-size:clamp(28px,5vw,46px);color:#ead49c}.hero p{margin:0;color:#c5bcaa}.status{display:inline-flex;margin-top:18px;padding:8px 14px;border-radius:999px;border:1px solid #74633e;background:#15130e;color:#d6c08b;font-size:13px}#bereiche{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.department{overflow:hidden;min-height:285px;background:linear-gradient(145deg,rgba(31,28,21,.96),rgba(10,10,8,.94));border:1px solid rgba(201,164,90,.55);box-shadow:0 12px 28px #0009}.department-head{display:flex;align-items:center;gap:15px;padding:16px;border-bottom:1px solid rgba(201,164,90,.35);background:rgba(0,0,0,.22)}.chest{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 4px 7px #000)}.department-title h3{margin:0;color:#e4c477;font-size:25px}.department-title span{display:block;margin-top:4px;color:#aaa18f;font-size:13px}.people{padding:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person{padding:10px 11px;background:linear-gradient(180deg,rgba(46,42,32,.92),rgba(23,21,17,.94));border:1px solid rgba(201,164,90,.28);border-radius:7px;min-width:0}.person .name{font-weight:bold;color:#f0dfb0;overflow-wrap:anywhere}.person .rank{margin-top:4px;color:#aaa18f;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:22px 10px;color:#928a7a;border:1px dashed rgba(201,164,90,.22);border-radius:7px}.footer{margin-top:22px;padding:18px;text-align:center;color:#968d7c;border-top:1px solid rgba(201,164,90,.3)}@media(max-width:760px){.page{width:min(100% - 18px,620px);padding-top:10px}.corner-banner{position:absolute;width:72px;left:9px;top:8px}.topbar{padding:78px 14px 14px;display:block;text-align:center}.back{display:inline-block;margin-top:12px}#bereiche{grid-template-columns:1fr;gap:14px}.people{grid-template-columns:1fr}.department{min-height:0}.hero{padding:25px 16px}}
</style></head><body><img class="corner-banner" src="https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/ehrenmarkt_banner_transparent.png" alt="Ehrenmarkt"><div class="page"><header class="topbar"><div class="brand"><h1>MITARBEITER</h1><p>Falkenstein · Ehrenmarkt</p></div><a class="back" href="startseite.html">← Zur Startseite</a></header><section class="hero"><h2>Unsere Gemeinschaft</h2><p>Alle aktiven Mitarbeiter werden automatisch aus dem Ehrenmarkt-System geladen.</p><div class="status" id="status">Mitarbeiter werden geladen …</div></section><main id="bereiche"></main><footer class="footer">Ehrenmarkt · Falkenstein</footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase.js"></script><script>
const DEPARTMENTS=[["Lagerist","Lager & Materialverwaltung","Logistik.png"],["Redstone","Technik & Redstone-Aufträge","Redstone.png"],["Farmer","Landwirtschaft & Versorgung","Farmer.png"],["Baumeister","Bauleitung & Bauaufträge","Baumeister.png"],["Buchhalter","Buchhaltung & Finanzen","Buchhalter.png"],["Händler","Handel & Verkauf","Handler.png"],["Logistik","Lagerung & Lieferung","Logistik.png"],["Gründer","Stadtleitung & Organisation","Grunder.png"]];const BASE="https://wvytteiqpwistcdcifcj.supabase.co/storage/v1/object/public/Bilder%20bereich/";const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function render(rows){document.getElementById("bereiche").innerHTML=DEPARTMENTS.map(d=>{const people=rows.filter(x=>String(x.role||"").trim().toLowerCase()===d[0].toLowerCase());return `<section class="department"><div class="department-head"><img class="chest" src="${BASE+d[2]}" alt="${esc(d[0])}"><div class="department-title"><h3>${esc(d[0])}</h3><span>${esc(d[1])}</span></div></div><div class="people">${people.length?people.map(p=>`<div class="person"><div class="name">${esc(p.name||"Unbekannt")}</div><div class="rank">${esc(p.rang||"Mitarbeiter")}</div></div>`).join(""):`<div class="empty">Aktuell keine aktiven Mitarbeiter in diesem Bereich.</div>`}</div></section>`}).join("")}async function loadEmployees(){try{if(!window.supabaseClient)throw new Error("Supabase-Verbindung nicht gefunden");const {data,error}=await window.supabaseClient.from("employees").select("id,name,role,rang,is_active").eq("is_active",true).order("role").order("name");if(error)throw error;render(data||[]);document.getElementById("status").textContent=`${(data||[]).length} aktive Mitarbeiter geladen`}catch(e){console.error(e);document.getElementById("bereiche").innerHTML='<section class="department" style="grid-column:1/-1"><div class="people"><div class="empty">Die Mitarbeiter konnten gerade nicht geladen werden.</div></div></section>';document.getElementById("status").textContent="Verbindung konnte nicht hergestellt werden"}}loadEmployees();</script></body></html>
