<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ehrenmarkt – OPSUCHT Auktionen</title>
<style>
:root{--bg:#090a0d;--p:#12151b;--p2:#181c23;--b:#292e38;--t:#f3f4f6;--m:#969daa;--g:#d9aa50;--g2:#f0c96c;--ok:#61d394;--bad:#e36b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#33271433,transparent 32%),var(--bg);color:var(--t);font-family:Arial,sans-serif}
header{height:70px;padding:0 5%;display:flex;align-items:center;border-bottom:1px solid var(--b);background:#0b0c10;position:sticky;top:0;z-index:5}.logo{font-size:23px;font-weight:800}.logo span{color:var(--g)}
main{max-width:1250px;margin:auto;padding:28px 5% 50px}.k{color:var(--g2);font-size:11px;letter-spacing:2px;font-weight:800}.hero h1{font-size:34px;margin:8px 0}.hero p{color:var(--m);line-height:1.5}
.status{margin:22px 0 14px;background:var(--p);border:1px solid var(--b);border-radius:11px;padding:12px 15px;font-size:12px;color:var(--m)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tools{display:flex;gap:10px;margin-bottom:18px}.search,select{flex:1;background:var(--p);border:1px solid var(--b);color:var(--t);padding:12px;border-radius:9px;outline:none}button{background:var(--g);border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}.card{background:linear-gradient(155deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:14px;overflow:hidden}.image{height:170px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2a2e37,#101217 70%);padding:20px}.image img{max-width:125px;max-height:125px;object-fit:contain}.fallback{font-size:54px}.body{padding:15px}.tag{font-size:10px;color:var(--g2);text-transform:uppercase;letter-spacing:1px}.name{font-size:18px;font-weight:750;margin:7px 0}.price{color:var(--g2);font-weight:800;font-size:19px}.muted{color:var(--m);font-size:11px;margin-top:6px}.view{width:100%;margin-top:13px}
.empty{color:var(--m);background:var(--p);border:1px solid var(--b);border-radius:12px;padding:25px}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20;overflow:auto}.overlay.show{display:flex}.modal{width:min(760px,100%);background:linear-gradient(160deg,#171b22,#0f1116);border:1px solid #3a3f49;border-radius:16px;box-shadow:0 20px 70px #000;max-height:92vh;overflow:auto}.modalTop{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--b)}.close{background:#242932;color:white;padding:8px 11px}.detailHero{display:grid;grid-template-columns:260px 1fr;gap:22px;padding:22px}.detailImg{height:250px;border-radius:13px;background:radial-gradient(circle,#2c303a,#0d0f13);display:flex;align-items:center;justify-content:center}.detailImg img{max-width:190px;max-height:190px}.detailImg .fallback{font-size:80px}.detailTitle{font-size:27px;margin:5px 0 16px}.bigprice{font-size:29px;color:var(--g2);font-weight:900}.info{margin-top:17px;border-top:1px solid var(--b);padding-top:12px}.infoRow{display:flex;justify-content:space-between;gap:15px;padding:7px 0;font-size:13px}.infoRow span{color:var(--m)}.chartBox{margin:0 22px 22px;padding:18px;border:1px solid var(--b);border-radius:13px;background:#0d0f13}.chart{height:180px;position:relative;overflow:hidden;margin-top:14px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,#252a33 45px)}.chart svg{width:100%;height:100%}.chartNote{font-size:11px;color:var(--m);margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:11px}.stat small{display:block;color:var(--m)}.stat b{display:block;margin-top:5px;color:var(--g2)}
@media(max-width:650px){main{padding:24px 4%}.tools{flex-wrap:wrap}.search,select{min-width:100%}.grid{grid-template-columns:1fr 1fr}.detailHero{grid-template-columns:1fr}.detailImg{height:210px}.stats{grid-template-columns:1fr}.hero h1{font-size:29px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">EHREN<span>MARKT</span> · OPSUCHT</div></header>
<main>
<section class="hero"><div class="k">ECHTE API-DATEN · TEST V3</div><h1>Auktionen</h1><p>Saubere Übersicht. Details und Verlauf öffnen sich erst beim Anklicken einer Auktion.</p></section>
<div id="status" class="status">⏳ Lade …</div>
<div class="tools"><input id="search" class="search" placeholder="Item, Verkäufer oder Kategorie suchen …"><select id="cat"><option value="">Alle Kategorien</option></select><button onclick="load()">↻ Aktualisieren</button></div>
<div id="grid" class="grid"></div>
</main>

<div id="overlay" class="overlay" onclick="if(event.target===this)closeDetail()">
<div class="modal">
<div class="modalTop"><strong>🔨 Auktion</strong><button class="close" onclick="closeDetail()">✕</button></div>
<div id="detail"></div>
</div></div>

<script>
const API="https://api.opsucht.net/auctions";
let auctions=[], categories=[];

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function deep(o,keys){if(!o||typeof o!=="object")return;for(const k of keys)if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];for(const v of Object.values(o))if(v&&typeof v==="object"){const x=deep(v,keys);if(x!==undefined)return x}}
function str(o,k){const v=deep(o,k);return v===undefined?undefined:String(v)}
function num(o,k){const v=deep(o,k);return typeof v==="number"?v:(v!==undefined&&!isNaN(Number(v))?Number(v):undefined)}
function name(a){return str(a,["displayName","itemName","name","display_name"])||"Unbekanntes Item"}
function seller(a){return str(a,["sellerName","seller","username","playerName","ownerName","createdBy"])||"Nicht angegeben"}
function category(a){return str(a,["categoryName","category","displayName","categoryDisplayName"])||"Unbekannt"}
function current(a){return num(a,["currentBid","highestBid","currentPrice","bid","price","amount","highestPrice"])}
function instant(a){return num(a,["instantBuyPrice","instantBoughtPrice","buyNowPrice","instantPrice","fixedPrice"])}
function quantity(a){return num(a,["quantity","amount","count","itemAmount"])}
function bids(a){return num(a,["bidCount","bids","numberOfBids","offers"])}
function id(a){return str(a,["id","uid","auctionId","auctionID"])||"—"}
function rawDate(a){return deep(a,["endTime","endsAt","endDate","expiresAt","expirationTime","expires"])}
function fmtDate(v){if(v===undefined)return"—";const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}
function left(a){const v=rawDate(a);if(v===undefined)return"—";const d=new Date(v);if(isNaN(d))return String(v);let s=Math.max(0,Math.floor((d-Date.now())/1000)),day=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return day?`${day} T. ${h} Std.`:h?`${h} Std. ${m} Min.`:m?`${m} Min.`:`${s} Sek.`}
function image(a){const u=deep(a,["imageUrl","iconUrl","image","icon","displayIcon","texture","thumbnail"]);return typeof u==="string"&&/^https?:\/\//i.test(u)?u:null}
function money(v){return v===undefined?"—":Number(v).toLocaleString("de-DE")+" $"}
function render(){
 const q=document.getElementById("search").value.toLowerCase(),c=document.getElementById("cat").value;
 const list=auctions.filter(a=>(!c||category(a)===c)&&(!q||[name(a),seller(a),category(a)].join(" ").toLowerCase().includes(q)));
 document.getElementById("grid").innerHTML=list.length?list.map((a,i)=>{const im=image(a);return `<article class="card"><div class="image">${im?`<img src="${esc(im)}" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<div class=fallback>🧱</div>')">`:'<div class="fallback">🧱</div>'}</div><div class="body"><div class="tag">${esc(category(a))}</div><div class="name">${esc(name(a))}</div><div class="price">${money(current(a))}</div><div class="muted">⏳ ${esc(left(a))}</div><button class="view" onclick="openDetail(${i},${JSON.stringify(a).replace(/</g,'\\u003c')})">Auktion ansehen</button></div></article>`}).join(""):'<div class="empty">Keine passenden Auktionen gefunden.</div>';
}
function openDetail(index,a){
 const im=image(a),end=rawDate(a);
 document.getElementById("detail").innerHTML=`<div class="detailHero"><div class="detailImg">${im?`<img src="${esc(im)}" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<div class=fallback>🧱</div>')">`:'<div class="fallback">🧱</div>'}</div><div><div class="tag">${esc(category(a))}</div><div class="detailTitle">${esc(name(a))}</div><div class="bigprice">${money(current(a))}</div><div class="info"><div class="infoRow"><span>⚡ Sofortkauf</span><b>${money(instant(a))}</b></div><div class="infoRow"><span>👤 Verkäufer</span><b>${esc(seller(a))}</b></div><div class="infoRow"><span>📦 Menge</span><b>${quantity(a)??"—"}</b></div><div class="infoRow"><span>🔨 Gebote</span><b>${bids(a)??"—"}</b></div><div class="infoRow"><span>⏳ Noch</span><b>${esc(left(a))}</b></div><div class="infoRow"><span>🏁 Ende</span><b>${esc(fmtDate(end))}</b></div><div class="infoRow"><span>🆔 Auktions-ID</span><b>${esc(id(a))}</b></div></div></div></div><div class="chartBox"><strong>📊 Verkaufspreis-Verlauf</strong><div class="stats"><div class="stat"><small>Durchschnitt</small><b>—</b></div><div class="stat"><small>Niedrigster</small><b>—</b></div><div class="stat"><small>Höchster</small><b>—</b></div></div><div class="chart"><svg viewBox="0 0 700 180" preserveAspectRatio="none"><polyline points="0,145 90,125 170,137 255,85 340,110 430,68 520,92 610,45 700,60" fill="none" stroke="#d9aa50" stroke-width="4"/><circle cx="0" cy="145" r="5" fill="#f0c96c"/><circle cx="700" cy="60" r="5" fill="#f0c96c"/></svg></div><div class="chartNote">Historische Verkaufsdaten sind in diesem Test noch nicht angebunden. Deshalb werden keine erfundenen Preise angezeigt.</div></div>`;
 document.getElementById("overlay").classList.add("show");
}
function closeDetail(){document.getElementById("overlay").classList.remove("show")}
async function load(){
 const st=document.getElementById("status");st.className="status";st.textContent="⏳ Lade echte aktive Auktionen …";
 try{
  const r=await fetch(API+"/active",{cache:"no-store"}),text=await r.text();if(!r.ok)throw Error("HTTP "+r.status);
  const d=JSON.parse(text);auctions=Array.isArray(d)?d:(d.auctions||d.data||[]);
  try{const cr=await fetch(API+"/categories",{cache:"no-store"}),cd=await cr.json();categories=Array.isArray(cd)?cd:(cd.categories||cd.data||[])}catch{}
  const names=[...new Set([...categories.map(x=>x.displayName||x.name).filter(Boolean),...auctions.map(category).filter(x=>x!=="Unbekannt")])];
  document.getElementById("cat").innerHTML='<option value="">Alle Kategorien</option>'+names.map(x=>`<option>${esc(x)}</option>`).join("");
  render();st.className="status ok";st.textContent=`🟢 API erreichbar · ${auctions.length.toLocaleString("de-DE")} aktive Auktionen`;
 }catch(e){st.className="status bad";st.textContent="🔴 Fehler: "+e.message;document.getElementById("grid").innerHTML='<div class="empty">Auktionen konnten nicht geladen werden.</div>'}
}
document.getElementById("search").oninput=render;document.getElementById("cat").onchange=render;load();
</script>
</body>
</html>
